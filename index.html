<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Revv Studio AI Automation Site</title>
    <meta property="og:title" content="Revv Studio — AI Automation" />
    <meta property="og:description" content="We build AI-powered systems that transform how businesses operate." />
    <meta property="og:image" content="https://www.revstudio.com/logo-5.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.revstudio.com/logo-5.png" />
  </head>
  <body>
    <!-- Static copy so Netlify Forms can detect this form at build time. The visible form is rendered by React. -->
    <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
