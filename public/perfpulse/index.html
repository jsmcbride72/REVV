<style>
  :root {
  /* ---- Official Brand Palette ---- */
  --pp-brand-navy: #0E2841;         /* Primary authority / chrome / dark ink */
  --pp-brand-paper: #F6F4EF;        /* Warm editorial canvas */
  --pp-brand-charcoal: #4D5B69;     /* Secondary / muted ink */
  --pp-brand-white: #FFFFFF;        /* Primary card surface */
  --pp-brand-blue: #0070C0;         /* Primary interactive accent */
  --pp-brand-orange: #FA4616;       /* Sparing highlight accent (UI/large only, 3.53:1 on #FFF) */
  --pp-brand-orange-tint: #FFF3EF;  /* Soft orange tint */
  --pp-brand-orange-ink: #B82E08;   /* 5.63:1 on #FFF3EF for text */

  /* ---- Surfaces ---- */
  --pp-bg-canvas: #F6F4EF;          /* Brand Paper page background */
  --pp-bg-surface: #FFFFFF;         /* Brand White card / panel surface */
  --pp-bg-subtle: #EFECE5;          /* Warm paper inset / table header */
  --pp-bg-chrome: #0E2841;          /* Brand Navy top bar */
  --pp-bg-chrome-subtle: #183654;   /* Elevated control on Navy chrome */

  /* ---- Typography Ink (WCAG 2.2 AA >= 4.5:1) ---- */
  --pp-ink-primary: #0E2841;        /* 15.02:1 on #FFF · 13.66:1 on #F6F4EF */
  --pp-ink-secondary: #2C3E50;      /* 10.97:1 on #FFF ·  9.98:1 on #F6F4EF */
  --pp-ink-muted: #4D5B69;          /*  6.96:1 on #FFF ·  6.33:1 on #F6F4EF (Brand Charcoal) */
  --pp-ink-on-dark: #FFFFFF;        /* 15.02:1 on #0E2841 */
  --pp-ink-on-dark-muted: #CBD5E1;  /* 10.11:1 on #0E2841 */

  /* ---- Brand Interactive Accent (Brand Blue #0070C0) ---- */
  --pp-accent: #0070C0;             /*  5.15:1 with #FFF text */
  --pp-accent-hover: #005A9E;       /*  7.10:1 with #FFF text */
  --pp-accent-active: #00467A;      /*  9.74:1 with #FFF text */
  --pp-accent-tint: #EDF5FC;        /* Soft blue tint surface */
  --pp-accent-border: #7CC0EA;      /* Accent border */
  --pp-accent-ink: #005A9E;         /*  6.45:1 on #EDF5FC */

  /* ---- Borders & Dividers (harmonized with Paper #F6F4EF) ---- */
  --pp-border-subtle: #E3DFD5;
  --pp-border-default: #CDC7BA;
  --pp-border-strong: #94A0AD;

  /* ---- Semantic Status (always paired with shape + text, never color alone) ---- */
  /* Success / Verified / Connected / Approved */
  --pp-status-ok-bg: #ECFDF5;
  --pp-status-ok-ink: #065F46;      /* 7.6:1 on #ECFDF5 */
  --pp-status-ok-border: #6EE7B7;
  --pp-status-ok-solid: #047857;    /* 5.5:1 with #FFF */

  /* Pending / Draft / Neutral / Not started */
  --pp-status-neutral-bg: #EFECE5;
  --pp-status-neutral-ink: #2C3E50; /* 9.5:1 on #EFECE5 */
  --pp-status-neutral-border: #94A0AD;

  /* Caution / Pending release (D28) / Warning */
  --pp-status-warn-bg: #FFFBEB;
  --pp-status-warn-ink: #92400E;    /* 7.2:1 on #FFFBEB */
  --pp-status-warn-border: #F59E0B;
  --pp-status-warn-accent: #D97706;

  /* Blocked / Error / Rejected */
  --pp-status-err-bg: #FEF2F2;
  --pp-status-err-ink: #991B1B;     /* 7.7:1 on #FEF2F2 */
  --pp-status-err-border: #F87171;
  --pp-status-err-solid: #B91C1C;   /* 6.5:1 with #FFF */

  /* Role Handoff Banner */
  --pp-handoff-bg: #EDF5FC;
  --pp-handoff-ink: #0E2841;        /* 13.63:1 on #EDF5FC */
  --pp-handoff-border: #7CC0EA;
  --pp-handoff-bar: #0070C0;

  /* Locked Evidence & Locked Role View */
  --pp-locked-bg: #F6F4EF;
  --pp-locked-stripe: #E3DFD5;
  --pp-locked-ink: #2C3E50;         /* 9.98:1 on #F6F4EF */
  --pp-locked-border: #CDC7BA;

  /* Workshop [OPEN] Rule Callout (Prototype Mode) */
  --pp-open-bg: #FAF5FF;
  --pp-open-ink: #581C87;           /* 10.1:1 on #FAF5FF */
  --pp-open-border: #A855F7;
  --pp-open-badge-bg: #6B21A8;      /* 9.6:1 with #FFF */
  --pp-open-badge-ink: #FFFFFF;

  /* ---- Typography (Official Performance Pulse Pairing) ---- */
  --pp-font-display: "Instrument Serif", Georgia, "Times New Roman", serif;
  --pp-font-sans: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --pp-font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;

  --pp-text-xs: 0.75rem;            /* 12px */
  --pp-text-sm: 0.875rem;           /* 14px */
  --pp-text-base: 1rem;             /* 16px */
  --pp-text-lg: 1.125rem;           /* 18px */
  --pp-text-xl: 1.5rem;             /* 24px */
  --pp-text-2xl: 2.125rem;          /* 34px — Instrument Serif display scale */

  --pp-leading-tight: 1.18;
  --pp-leading-normal: 1.5;
  --pp-leading-relaxed: 1.6;

  /* ---- Spacing Scale (4px base) ---- */
  --pp-space-1: 4px;
  --pp-space-2: 8px;
  --pp-space-3: 12px;
  --pp-space-4: 16px;
  --pp-space-5: 20px;
  --pp-space-6: 24px;
  --pp-space-8: 32px;
  --pp-space-10: 40px;

  /* ---- Radii ---- */
  --pp-radius-sm: 6px;
  --pp-radius-md: 10px;
  --pp-radius-lg: 14px;
  --pp-radius-pill: 999px;

  /* ---- Elevation ---- */
  --pp-shadow-xs: 0 1px 2px rgba(14, 40, 65, 0.05);
  --pp-shadow-sm: 0 1px 3px rgba(14, 40, 65, 0.08), 0 1px 2px rgba(14, 40, 65, 0.04);
  --pp-shadow-md: 0 4px 12px rgba(14, 40, 65, 0.08), 0 2px 4px rgba(14, 40, 65, 0.04);
  --pp-shadow-lg: 0 16px 36px rgba(14, 40, 65, 0.18);

  /* ---- Interactive & Accessibility ---- */
  --pp-target-min: 44px;            /* WCAG 2.2 AA minimum target size */
  --pp-focus-ring: 0 0 0 2px #FFFFFF, 0 0 0 5px #0070C0;
  --pp-transition: 140ms cubic-bezier(0.2, 0, 0, 1);
}
  * { box-sizing: border-box; }
  html { font-family: var(--pp-font-sans); font-size: 16px; color: var(--pp-ink-primary); background: var(--pp-bg-canvas); -webkit-font-smoothing: antialiased; }
  body { margin: 0; line-height: 1.5; }
  code, .mono { font-family: var(--pp-font-mono); }
  .tnum { font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
  .skip { position: absolute; left: -9999px; top: 8px; background: var(--pp-accent); color: #FFF; padding: 10px 16px; border-radius: var(--pp-radius-sm); font-weight: 600; z-index: 100; text-decoration: none; }
  .skip:focus { left: 12px; }
  :focus-visible { outline: none; box-shadow: var(--pp-focus-ring); }

  .topbar { background: var(--pp-bg-chrome); color: var(--pp-ink-on-dark); border-bottom: 2px solid #0070C0; position: sticky; top: 0; z-index: 30; }
  .topbar-inner { max-width: 1120px; margin: 0 auto; padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-title { font-size: var(--pp-text-base); font-weight: 700; letter-spacing: -0.015em; margin: 0; line-height: 1.2; }
  .brand-sub { font-size: var(--pp-text-xs); color: var(--pp-ink-on-dark-muted); margin: 1px 0 0; }
  .topbar-right { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .company-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--pp-radius-pill); background: var(--pp-bg-chrome-subtle); border: 1px solid #334155; font-size: var(--pp-text-xs); color: var(--pp-ink-on-dark); font-weight: 600; }
  .guide-link { display: inline-flex; align-items: center; min-height: var(--pp-target-min); padding: 0 12px; border-radius: var(--pp-radius-sm); color: var(--pp-ink-on-dark); border: 1px solid #334155; text-decoration: none; font-size: var(--pp-text-xs); font-weight: 600; }
  .guide-link:hover { background: var(--pp-bg-chrome-subtle); }

  .rolebar-wrap { background: var(--pp-bg-surface); border-bottom: 1px solid var(--pp-border-subtle); }
  .rolebar { max-width: 1120px; margin: 0 auto; padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; }
  .rolebar-group { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: var(--pp-text-sm); }
  .rolebar label { font-size: var(--pp-text-xs); font-weight: 700; color: var(--pp-ink-muted); text-transform: uppercase; letter-spacing: 0.04em; }

  .stepper-wrap { max-width: 1120px; margin: 0 auto; padding: 16px 20px 0; }
  nav.stepper ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 900px) { nav.stepper ol { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); } }
  nav.stepper button { width: 100%; min-height: 60px; padding: 10px 12px; border-radius: var(--pp-radius-md); border: 1.5px solid var(--pp-border-subtle); background: var(--pp-bg-surface); color: var(--pp-ink-primary); font: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; justify-content: center; gap: 3px; box-shadow: var(--pp-shadow-xs); }
  nav.stepper button:hover { border-color: var(--pp-accent-border); background: var(--pp-accent-tint); }
  nav.stepper button[aria-current="step"] { background: var(--pp-accent); border-color: var(--pp-accent); color: #FFF; box-shadow: var(--pp-shadow-sm); }
  nav.stepper .step-title { font-size: var(--pp-text-sm); font-weight: 700; line-height: 1.25; }
  nav.stepper .step-meta { font-size: var(--pp-text-xs); color: var(--pp-ink-muted); display: flex; align-items: center; gap: 6px; }
  nav.stepper button[aria-current="step"] .step-meta { color: #E0F2FE; }
  .pulse-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--pp-brand-orange); flex: 0 0 auto; }

  .layout { max-width: 1120px; margin: 0 auto; padding: 20px 20px 56px; display: block; }
  .demo-footer { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--pp-border-subtle); }
  @media (max-width: 1020px) { .layout { grid-template-columns: 1fr; } }
  main { min-width: 0; outline: none; }

  .screen-head { margin-bottom: 16px; }
  .screen-head-top { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
  .screen-head h2 { margin: 0; font-family: var(--pp-font-display); font-size: var(--pp-text-2xl); font-weight: 400; letter-spacing: -0.005em; line-height: 1.15; color: var(--pp-ink-primary); }
  .screen-goal { margin: 6px 0 0; font-size: var(--pp-text-sm); color: var(--pp-ink-muted); }

  .card { background: var(--pp-bg-surface); border: 1px solid var(--pp-border-subtle); border-radius: var(--pp-radius-lg); padding: 20px; margin-bottom: 16px; box-shadow: var(--pp-shadow-xs); }
  .card.soft { background: var(--pp-bg-subtle); }
  .card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin-bottom: 14px; }
  .card h3 { margin: 0; font-size: var(--pp-text-lg); font-weight: 700; letter-spacing: -0.01em; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .card h4 { margin: 0 0 8px; font-size: var(--pp-text-base); font-weight: 700; }
  .note { font-size: var(--pp-text-sm); color: var(--pp-ink-muted); margin: 6px 0 0; }
  .divider { border: 0; border-top: 1px solid var(--pp-border-subtle); margin: 18px 0; }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 12px; }
  .kpi { background: var(--pp-bg-subtle); border: 1px solid var(--pp-border-subtle); border-radius: var(--pp-radius-md); padding: 12px 14px; }
  .kpi-label { font-size: var(--pp-text-xs); font-weight: 600; color: var(--pp-ink-muted); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 4px; }
  .kpi-val { font-size: var(--pp-text-base); font-weight: 700; color: var(--pp-ink-primary); }
  .kpi-sub { font-size: var(--pp-text-xs); color: var(--pp-ink-muted); margin-top: 2px; }

  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--pp-radius-pill); font-size: var(--pp-text-xs); font-weight: 600; line-height: 1.3; border: 1px solid transparent; white-space: nowrap; }
  .chip-ok { background: var(--pp-status-ok-bg); color: var(--pp-status-ok-ink); border-color: var(--pp-status-ok-border); }
  .chip-neutral { background: var(--pp-status-neutral-bg); color: var(--pp-status-neutral-ink); border: 1px dashed var(--pp-status-neutral-border); }
  .chip-warn { background: var(--pp-status-warn-bg); color: var(--pp-status-warn-ink); border: 1px dashed var(--pp-status-warn-border); }
  .chip-err { background: var(--pp-status-err-bg); color: var(--pp-status-err-ink); border-color: var(--pp-status-err-border); }
  .chip-role { background: var(--pp-handoff-bg); color: var(--pp-handoff-ink); border-color: var(--pp-handoff-border); }
  .chip-open { background: var(--pp-open-badge-bg); color: var(--pp-open-badge-ink); font-family: var(--pp-font-mono); border-radius: var(--pp-radius-sm); }
  .chip-assume { background: var(--pp-bg-subtle); color: var(--pp-ink-secondary); border: 1px dashed var(--pp-border-strong); font-family: var(--pp-font-mono); border-radius: var(--pp-radius-sm); }

  .banner { border-radius: var(--pp-radius-md); padding: 14px 16px; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; justify-content: space-between; }
  .banner-copy { flex: 1 1 250px; }
  .banner-title { font-weight: 700; font-size: var(--pp-text-sm); display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
  .banner-desc { font-size: var(--pp-text-sm); margin: 0; }
  .banner-handoff { background: var(--pp-handoff-bg); color: var(--pp-handoff-ink); border: 1px solid var(--pp-handoff-border); border-left: 4px solid var(--pp-handoff-bar); }
  .banner-warn { background: var(--pp-status-warn-bg); color: var(--pp-status-warn-ink); border: 1px dashed var(--pp-status-warn-border); border-left: 4px solid var(--pp-status-warn-accent); }
  .banner-err { background: var(--pp-status-err-bg); color: var(--pp-status-err-ink); border: 1px solid var(--pp-status-err-border); border-left: 4px solid var(--pp-status-err-solid); }
  .banner-info { background: var(--pp-bg-subtle); color: var(--pp-ink-primary); border: 1px solid var(--pp-border-default); border-left: 4px solid var(--pp-ink-secondary); }

  .open-callout { background: var(--pp-open-bg); color: var(--pp-open-ink); border: 1.5px dashed var(--pp-open-border); border-radius: var(--pp-radius-md); padding: 11px 14px; margin-top: 14px; font-size: var(--pp-text-sm); display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
  .assume-note { font-size: var(--pp-text-xs); color: var(--pp-ink-muted); display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 12px; }

  .locked-panel, .locked-cell { background: repeating-linear-gradient(-45deg, var(--pp-locked-bg), var(--pp-locked-bg) 10px, #F1F5F9 10px, #F1F5F9 20px); color: var(--pp-locked-ink); }
  .locked-panel { border: 1px solid var(--pp-locked-border); border-radius: var(--pp-radius-md); padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; justify-content: space-between; }
  .locked-cell { padding: 12px 14px !important; }

  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--pp-target-min); min-width: var(--pp-target-min); padding: 9px 16px; border-radius: var(--pp-radius-sm); font: inherit; font-size: var(--pp-text-sm); font-weight: 600; cursor: pointer; border: 1.5px solid var(--pp-border-default); background: var(--pp-bg-surface); color: var(--pp-ink-primary); box-shadow: var(--pp-shadow-xs); }
  button.btn:hover:not([aria-disabled="true"]) { background: var(--pp-bg-subtle); border-color: var(--pp-border-strong); }
  button.btn.primary { background: var(--pp-accent); border-color: var(--pp-accent); color: #FFF; }
  button.btn.primary:hover:not([aria-disabled="true"]) { background: var(--pp-accent-hover); border-color: var(--pp-accent-hover); }
  button.btn.danger { background: var(--pp-status-err-bg); border-color: var(--pp-status-err-border); color: var(--pp-status-err-ink); }
  button.btn[aria-disabled="true"] { background: var(--pp-bg-subtle); border: 1.5px dashed var(--pp-border-strong); color: var(--pp-ink-muted); cursor: not-allowed; box-shadow: none; }

  select, input[type="number"], input[type="date"], textarea { font: inherit; font-size: var(--pp-text-sm); min-height: var(--pp-target-min); padding: 8px 12px; border: 1.5px solid var(--pp-border-default); border-radius: var(--pp-radius-sm); background: var(--pp-bg-surface); color: var(--pp-ink-primary); }
  select:disabled, input:disabled, textarea:disabled { background: var(--pp-bg-subtle); color: var(--pp-ink-muted); cursor: not-allowed; }
  textarea { width: 100%; min-height: 76px; resize: vertical; }
  .field { margin: 12px 0; }
  .field > label { display: block; font-size: var(--pp-text-sm); font-weight: 600; margin-bottom: 6px; }
  .check-row { display: flex; align-items: center; gap: 10px; min-height: var(--pp-target-min); padding: 4px 0; }
  .check-row input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--pp-accent); cursor: pointer; flex: 0 0 auto; }
  .check-row label { font-size: var(--pp-text-sm); font-weight: 600; cursor: pointer; }

  .switch-row { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--pp-border-subtle); }
  .switch-row:last-of-type { border-bottom: none; }
  .switch-btn { position: relative; width: 52px; height: 30px; min-height: 30px; border-radius: var(--pp-radius-pill); border: 2px solid var(--pp-border-strong); background: var(--pp-bg-subtle); cursor: pointer; flex: 0 0 auto; padding: 0; }
  .switch-btn::before { content: ""; position: absolute; inset: -8px -4px; }
  .switch-btn::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--pp-ink-secondary); transition: transform var(--pp-transition); }
  .switch-btn[aria-checked="true"] { background: var(--pp-accent); border-color: var(--pp-accent); }
  .switch-btn[aria-checked="true"]::after { transform: translateX(22px); background: #FFF; }
  .switch-btn[aria-disabled="true"] { opacity: 0.55; cursor: not-allowed; }
  .switch-label { font-size: var(--pp-text-sm); font-weight: 500; }

  .table-wrap { width: 100%; overflow-x: auto; border: 1px solid var(--pp-border-subtle); border-radius: var(--pp-radius-md); }
  table { border-collapse: collapse; width: 100%; font-size: var(--pp-text-sm); min-width: 520px; }
  th, td { padding: 11px 14px; text-align: left; vertical-align: middle; border-bottom: 1px solid var(--pp-border-subtle); }
  thead th { background: var(--pp-bg-subtle); color: var(--pp-ink-secondary); font-size: var(--pp-text-xs); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
  tbody tr:last-child td, tbody tr:last-child th { border-bottom: none; }
  tbody th { font-weight: 600; color: var(--pp-ink-primary); }

  .grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .weight-card { border: 1px solid var(--pp-border-subtle); border-radius: var(--pp-radius-md); padding: 14px; background: #FAFBFC; }
  .weight-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .weight-card label { font-size: var(--pp-text-sm); font-weight: 700; }
  .weight-card input[type="range"] { width: 100%; height: 36px; accent-color: var(--pp-accent); cursor: pointer; }
  .weight-card input[type="number"] { width: 78px; text-align: right; font-weight: 700; }
  .alloc-bar { height: 12px; border-radius: var(--pp-radius-pill); background: var(--pp-bg-subtle); overflow: hidden; display: flex; margin: 14px 0 8px; border: 1px solid var(--pp-border-subtle); }
  .alloc-seg { height: 100%; }
  .export-card { border: 1px solid var(--pp-border-subtle); border-radius: var(--pp-radius-md); padding: 16px; background: #FAFBFC; display: flex; flex-direction: column; gap: 10px; }

  .bar-track { width: 100%; min-width: 100px; height: 10px; border-radius: var(--pp-radius-pill); background: var(--pp-bg-subtle); overflow: hidden; border: 1px solid var(--pp-border-subtle); }
  .bar-fill { height: 100%; border-radius: var(--pp-radius-pill); }

  aside.panel { background: var(--pp-bg-surface); border: 1px solid var(--pp-border-subtle); border-radius: var(--pp-radius-lg); padding: 18px; box-shadow: var(--pp-shadow-xs); position: sticky; top: 84px; }
  @media (max-width: 1020px) { aside.panel { position: static; } }
  aside.panel h2 { margin: 0 0 4px; font-size: var(--pp-text-base); font-weight: 700; display: flex; align-items: center; justify-content: space-between; }
  aside.panel .field { margin: 12px 0; }
  aside.panel label { font-size: var(--pp-text-xs); font-weight: 700; color: var(--pp-ink-secondary); }
  aside.panel select { width: 100%; }
  .rail-footer { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--pp-border-subtle); display: flex; flex-wrap: wrap; gap: 8px; }

  dialog { border: 1px solid var(--pp-border-default); border-radius: var(--pp-radius-lg); padding: 24px; max-width: 480px; width: calc(100% - 32px); box-shadow: var(--pp-shadow-lg); color: var(--pp-ink-primary); }
  dialog::backdrop { background: rgba(15, 27, 45, 0.55); }
  dialog h3 { margin: 0 0 8px; font-size: var(--pp-text-xl); }

  @media (max-width: 600px) {
    .topbar-inner, .rolebar, .stepper-wrap, .layout { padding-left: 14px; padding-right: 14px; }
    .card { padding: 16px; }
    .screen-head h2 { font-size: 1.375rem; }
  }

  /* ---- Two-Phase Stepper ---- */
  .stepper-phases { display: flex; flex-direction: column; gap: 10px; }
  .phase-group { display: flex; flex-direction: column; gap: 6px; }
  .phase-label {
    font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--pp-ink-muted); margin: 0; display: flex; align-items: center; gap: 6px;
  }
  .phase-label::before {
    content: ""; width: 7px; height: 7px; border-radius: 999px; background: var(--pp-brand-blue); display: inline-block;
  }
  .phase-group.p2 .phase-label::before { background: var(--pp-brand-navy); }
  .stepper ol.phase1-list { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .stepper ol.phase2-list { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  @media (max-width: 900px) {
    .stepper ol.phase1-list, .stepper ol.phase2-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 560px) {
    .stepper ol.phase1-list, .stepper ol.phase2-list { grid-template-columns: 1fr; }
  }
  /* ---- Phase 1 Components ---- */
  .field-err { color: var(--pp-status-err-ink); font-size: var(--pp-text-sm); font-weight: 600; margin: 6px 0 0; }
  .privacy-box {
    margin-top: 16px; padding: 12px 14px; border-radius: var(--pp-radius-md);
    background: var(--pp-bg-canvas); border: 1px solid var(--pp-border-subtle);
    font-size: var(--pp-text-sm); color: var(--pp-ink-primary);
  }
  .privacy-box strong { color: var(--pp-brand-navy); }

  input[type="email"], input[type="text"] {
    width: 100%; min-height: 44px; padding: 10px 14px;
    border: 1px solid var(--pp-border-default); border-radius: var(--pp-radius-md);
    background: var(--pp-bg-surface); color: var(--pp-ink-primary);
    font-family: var(--pp-font-sans); font-size: var(--pp-text-base);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input[type="email"]:focus, input[type="text"]:focus {
    outline: none; border-color: var(--pp-brand-blue); box-shadow: 0 0 0 3px var(--pp-accent-tint);
  }
  input[aria-invalid="true"] { border-color: var(--pp-status-err-solid); background: var(--pp-status-err-bg); }

  .code-input {
    font-family: var(--pp-font-mono); font-size: 1.5rem; font-weight: 700; letter-spacing: 0.28em;
    text-align: center; max-width: 240px; padding: 10px 14px !important;
  }
  .scan-bar-wrap { margin: 14px 0 16px; }
  .scan-bar-meta { display: flex; justify-content: space-between; font-size: var(--pp-text-xs); font-weight: 700; color: var(--pp-ink-muted); margin-bottom: 6px; }
  .scan-bar-track { height: 10px; background: var(--pp-bg-subtle); border-radius: 999px; overflow: hidden; }
  .scan-bar-fill { height: 100%; background: var(--pp-brand-blue); border-radius: 999px; transition: width 0.35s ease; }
  .scan-steps { list-style: none; padding: 0; margin: 0 0 16px; display: flex; flex-direction: column; gap: 10px; }
  .scan-steps li {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border: 1px solid var(--pp-border-subtle); border-radius: var(--pp-radius-md);
    background: var(--pp-bg-canvas); font-size: var(--pp-text-sm); font-weight: 500;
  }
  .add-sys-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--pp-border-subtle); }
  .add-sys-row .field { margin: 0; flex: 1 1 240px; }
  .pulse-panel { margin-top: 14px; display: flex; flex-direction: column; gap: 12px; }
  .pulse-q {
    border: 1px solid var(--pp-border-subtle); border-radius: var(--pp-radius-md);
    padding: 12px 14px; margin: 0; background: var(--pp-bg-canvas);
  }
  .pulse-q legend { font-size: var(--pp-text-sm); font-weight: 700; color: var(--pp-ink-primary); padding: 0 4px; }
  .pulse-opts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .pulse-opt {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; min-height: 44px;
    border: 1px solid var(--pp-border-default); border-radius: var(--pp-radius-md);
    background: var(--pp-bg-surface); font-size: var(--pp-text-sm); font-weight: 600; cursor: pointer;
  }
  .pulse-opt input[type="radio"] { width: 18px; height: 18px; accent-color: var(--pp-brand-blue); margin: 0; }
  .table-input { width: 100%; min-width: 120px; max-width: 220px; min-height: 40px; padding: 6px 10px; font-size: var(--pp-text-sm); }
  @media (max-width: 640px) { .table-input { min-width: 96px; max-width: 100%; } }

</style>

      h += '<tr><th scope="row">' + esc(f[1]) + '</th><td>' + esc(f[2]) + '</td><td>' + chip(f[3] === "Scan" ? "neutral" : "ok", f[3] === "Scan" ? "○" : "✓", f[3]) + '</td><td>' +
        (ok ? '<button type="button" class="btn" data-act="drill" data-k="' + f[0] + '" aria-expanded="' + open + '" aria-controls="ev-' + f[0] + '">' + (open ? "Hide evidence" : "View evidence") + '</button>' : chip("locked", "🔒", "Restricted")) + '</td></tr>';
      if (ok && open) h += '<tr id="ev-' + f[0] + '"><td colspan="4"><div class="evidence-drawer"><strong>Source evidence (sample) · ' + esc(f[1]) + '</strong><p style="margin:6px 0 0;">Derived from ' + esc(f[3]) + '. Personal data stripped in the browser prior to upload. Traceable to company record.</p></div></td></tr>';
      else if (!ok) h += '<tr><td colspan="4"><div class="locked-panel"><div class="banner-copy"><div class="banner-title"><span aria-hidden="true">🔒</span> Evidence restricted to ' + esc(f[1]) + ' Area Owner, AI Lead &amp; Executive Sponsor</div><p class="banner-desc">You can see the company-level finding summary above, while source files remain scoped to their area.</p></div>' + btn("reqAccess", "Request access from AI Lead") + '</div></td></tr>';
    });
    h += '</tbody></table></div></section>';
    return h + baselineBlock();
  }

  function baselineBlock() {
    var h = '<section class="card" aria-labelledby="base-h"><div class="card-head"><h3 id="base-h">Baseline Date</h3>' + (S.baseline ? chip("ok", "✓", "Recorded · " + S.baseline) : chip("neutral", "○", "Not recorded")) + '</div>';
    if (S.baseline) h += '<p style="margin:0 0 12px;font-size:var(--pp-text-sm);"><strong>Snapshot recorded:</strong> ' + esc(S.baseline) + ' (America/New_York) · by AI Lead · <span class="mono">snapshot #0001</span></p>' + btn("clearBaseline", "Clear baseline (prototype only)");
    else h += '<div class="row">' + btn("baseline", "Record Baseline Date…", { primary: true, disabled: S.role !== "ai" || !consentOk() || !sponsorOk(), describedby: "b-hint" }) + '<span id="b-hint" class="note" style="margin:0;">' + (S.role !== "ai" ? "Only the AI Lead records the baseline." : (!consentOk() ? "Blocked: Security approval needed." : "Locks today's findings as the reference point.")) + '</span></div>';
    return h + '</section>';
  }

  function renderStepper() {
    var done = { a: S.codeSent, b: S.verified, c: S.companyOk === "yes", d: S.continued, 1: S.confirmed, 2: consentOk(), 3: S.conn.entra !== "none" || anyConnected(), 4: total() === 100 && (S.exports.finance || S.exports.hr || S.exports.crm), 5: !!S.baseline };
    function item(s, label) {
      var st = done[s.id] ? "✓ Done" : (s.id === S.screen ? "● Current" : "○ Not started");
      return '<li><button type="button" data-goto="' + s.id + '"' + (s.id === S.screen ? ' aria-current="step"' : "") + '><span class="step-title">' + label + ' · ' + esc(s.name) + '</span><span class="step-meta"><span>' + esc(ROLES[s.expected]) + '</span><span>·</span><span>' + st + '</span></span></button></li>';
    }
    $("stepper").innerHTML =
      '<div class="phase-group p1"><p class="phase-label" id="ph1">Phase 1 · Public Scan</p><ol class="phase1-list" aria-labelledby="ph1">' + P1.map(function (s) { return item(s, s.id.toUpperCase()); }).join("") + '</ol></div>' +
      '<div class="phase-group p2"><p class="phase-label" id="ph2">Phase 2 · One-CTO Onboarding</p><ol class="phase2-list" aria-labelledby="ph2">' + SCREENS.map(function (s) { return item(s, String(s.id)); }).join("") + '</ol></div>';
  }

  function render(focusMain) {
    var active = document.activeElement, aId = active && active.id, aAct = active && active.getAttribute && active.getAttribute("data-act"), aK = active && active.getAttribute && active.getAttribute("data-k");
    var sc = scr(S.screen);
    renderStepper();
    $("role-chip").textContent = ROLES[S.role];
    $("role-select").value = S.role;
    $("expected-role").textContent = S.screen === 3 ? "AI Lead (3a) → System Admin (3b)" : ROLES[sc.expected];
    var compLabel = isP1(S.screen) ? (S.company ? S.company + " · Public Scan" : "Public Scan · Demo") : (rr().company + " · $50M–$100M");
    $("company-pill").innerHTML = '<span class="pulse-dot" aria-hidden="true"></span>' + esc(compLabel);
    $("main").innerHTML = isP1(S.screen) ? { a: pA, b: pB, c: pC, d: pD }[S.screen]() : [s1, s2, s3, s4, s5][S.screen - 1]();
    var idx = ORDER.indexOf(S.screen);
    $("prev").setAttribute("aria-disabled", String(idx === 0));
    $("next").setAttribute("aria-disabled", String(idx === ORDER.length - 1));
    document.title = (isP1(S.screen) ? S.screen.toUpperCase() : S.screen) + " · " + sc.name + " · Performance Pulse Prototype";
    if (focusMain) { $("main").focus(); return; }
    var target = aId ? $(aId) : null;
    if (!target && aAct) target = document.querySelector('[data-act="' + aAct + '"]' + (aK ? '[data-k="' + aK + '"]' : ""));
    if (target && target.focus) target.focus();
  }

  function go(n) {
    n = parseId(n);
    if (ORDER.indexOf(n) < 0) n = "a";
    if (isP1(n)) S.role = "vis"; else if (S.role === "vis") S.role = "ai";
    S.screen = n; render(true);
    announce((isP1(n) ? "Phase 1, screen " + n.toUpperCase() : "Phase 2, screen " + n) + ": " + scr(n).name);
  }

  document.addEventListener("click", function (e) {
    var g = e.target.closest("[data-goto]"); if (g) { go(g.getAttribute("data-goto")); return; }
    var b = e.target.closest("[data-act]"); if (!b) return;
    if (b.getAttribute("aria-disabled") === "true") { var d = b.getAttribute("aria-describedby"); announce("Action blocked. " + (d && $(d) ? $(d).textContent : "")); return; }
    var a = b.getAttribute("data-act"), k = b.getAttribute("data-k"), msg = "";
    switch (a) {
      case "switch": S.role = k; msg = "Now acting as " + ROLES[k]; break;
      case "assign": msg = "Prototype: assignment sent to " + ROLES[k] + "."; break;
      case "go": go(k); return;
      case "sendCode": {
        var em = S.email.trim(), dom = em.split("@")[1] || "";
        if (!em) S.emailErr = "Enter your work email.";
        else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) S.emailErr = "Enter an email like name@company.com.";
        else if (PERSONAL.indexOf(dom.toLowerCase()) >= 0) S.emailErr = "Use your work email. We use its domain to find your company, so personal addresses like " + dom.toLowerCase() + " can\u2019t be scanned.";
        else { S.emailErr = ""; S.email = em; S.domain = dom.toLowerCase(); S.company = companyFrom(S.domain); S.codeSent = true; S.code = ""; S.codeErr = ""; S.verified = false; S.resends = 0; S.systems = freshSystems(); S.continued = false; S.scan = "idle"; S.companyOk = null; go("b"); announce("Code sent to " + em + "."); return; }
        render(); var ef = $("p-email"); if (ef) ef.focus(); announce(S.emailErr); return;
      }
      case "verifyCode": {
        var c = S.code.trim();
        if (!/^\d{6}$/.test(c)) S.codeErr = "Enter the six digits from the email.";
        else if (c === "000000") S.codeErr = "That code doesn\u2019t match. Check the latest email, or resend.";
        else if (c === "999999") S.codeErr = "That code has expired. Send a new one.";
        else { S.codeErr = ""; S.verified = true; startScan(); go("c"); announce("Email verified. Scanning public information."); return; }
        render(); var cf = $("p-code"); if (cf) cf.focus(); announce(S.codeErr); return;
      }
      case "resend": if (S.screen === "b") { S.resends += 1; S.code = ""; S.codeErr = ""; msg = "New code sent to " + S.email + "."; } else { msg = "Reminder sent to Security Reviewer."; } break;
      case "completeScan": finishScan(); return;
      case "slowScan": window.clearTimeout(scanTimer); S.scan = "slow"; msg = "The scan is taking longer than usual."; break;
      case "resumeScan": S.scan = "running"; tick(); msg = "Still scanning."; break;
      case "exitScan": window.clearTimeout(scanTimer); S.scan = "done"; S.scanStep = 3; S.companyOk = "yes"; S.exited = true; go("d"); announce("We'll email your results to " + S.email + " when they're ready."); return;
      case "companyYes": S.companyOk = "yes"; msg = "Company confirmed. Now tell us which tools you use."; break;
      case "companyNo": S.companyOk = "no"; S.domainInput = ""; S.domainErr = ""; msg = "Tell us your company's website."; break;
      case "notFound": S.scan = "notfound"; S.domainInput = ""; S.domainErr = ""; msg = "We couldn't match your domain to a company."; break;
      case "rescan": {
        var dm = S.domainInput.trim().toLowerCase().replace(/^https?:\/\//, "").replace(/\/.*$/, "");
        if (!/^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(dm)) { S.domainErr = "Enter a website like acme.com."; render(); var df = $("p-domain"); if (df) df.focus(); announce(S.domainErr); return; }
        S.domainErr = ""; S.domain = dm; S.company = companyFrom(dm); startScan(); render(true); announce("Scanning public information for " + dm + "."); return;
      }
      case "addSys": {
        var nm = S.newSys.trim();
        if (!nm) { S.newSysErr = "Enter a system name."; render(); var nf = $("p-newsys"); if (nf) nf.focus(); announce(S.newSysErr); return; }
        S.systems.push({ id: "c" + S.systems.length, name: nm, cat: "Added by you", inf: "Not detected", use: "yes", owner: "" }); S.newSys = ""; S.newSysErr = ""; msg = nm + " added as a system you use."; break;
      }
      case "pulse": S.pulseOpen = !S.pulseOpen; break;
      case "exitSave": S.exited = true; msg = "Results emailed to " + S.email + ". You can come back any time."; break;
      case "undoExit": S.exited = false; msg = "Back to your results."; break;
      case "continueRR": S.continued = true; S.confirmed = false; S.callBooked = false; S.role = "ai"; S.screen = 1; render(true); announce("Company record created for " + S.company + ". Now acting as AI Lead on Record Ready."); return;
      case "confirm": S.confirmed = true; msg = "Record confirmed."; break;
      case "flag": S.flagOpen = !S.flagOpen; break;
      case "bookCall": S.callBooked = !S.callBooked; msg = S.callBooked ? "Call request noted." : "Call request dismissed."; break;
      case "reqSponsor": S.sponsor = "requested"; msg = "Sponsor sign-off requested."; break;
      case "signSponsor": S.sponsor = "signed"; msg = "Proposal signed by Executive Sponsor."; break;
      case "handoffSec": S.role = "sec"; go(2); return;
      case "approve": S.approval = "approved"; S.changesOpen = false; msg = "One-time approval recorded."; break;
      case "changes": S.changesOpen = !S.changesOpen; break;
      case "sendChanges": S.approval = "changes"; S.changesOpen = false; msg = "Changes requested from AI Lead."; break;
      case "revoke": S.approval = "pending"; S.reviewed = false; S.released = false; S.collection = false; msg = "Consent revoked."; break;
      case "handbackAi": S.role = "ai"; go(3); return;
      case "setting": S.settings[k] = !S.settings[k]; msg = "Setting updated."; break;
      case "handoffSys": S.role = "sys"; msg = "Handed off to System Admin."; break;
      case "connect": S.conn[k] = "connecting"; render(); window.setTimeout(function () { S.conn[k] = "connected"; render(); announce("Connected."); }, 260); return;
      case "stub": S.conn[k] = "stub"; msg = "Stubbed for demo."; break;
      case "disconnect": S.conn[k] = "none"; msg = "Disconnected."; break;
      case "fail": S.conn[k] = "error"; msg = "Simulated authorisation error."; break;
      case "startCollection": S.collection = true; msg = "Collection started."; break;
      case "handbackAi3": S.role = "ai"; go(4); return;
      case "rebalance":
        var t = total();
        if (t > 0) { var keys = ["finance", "hr", "crm", "eng"], acc = 0; keys.forEach(function (key, i) { if (i < 3) { S.weights[key] = Math.round(S.weights[key] / t * 100); acc += S.weights[key]; } else S.weights[key] = Math.max(0, 100 - acc); }); }
        msg = "Weights rebalanced to 100%."; break;
      case "even": S.weights = { finance: 25, hr: 25, crm: 25, eng: 25 }; msg = "Reset to 25% each."; break;
      case "attach": S.exports[k] = !S.exports[k]; S.expErr[k] = false; msg = S.exports[k] ? "Sample file attached." : "Sample file removed."; break;
      case "badfile": S.expErr[k] = true; msg = "File rejected."; break;
      case "toFindings": go(5); return;
      case "drill": S.open[k] = !S.open[k]; break;
      case "reqAccess": msg = "Access request sent to AI Lead."; break;
      case "baseline": openBaseline(); return;
      case "clearBaseline": S.baseline = null; S.baselineSign = "none"; msg = "Baseline cleared."; break;
    }
    render(); if (msg) announce(msg);
  });

  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.id === "p-email") { S.email = t.value; return; }
    if (t.id === "p-code") { S.code = t.value; return; }
    if (t.id === "p-domain") { S.domainInput = t.value; return; }
    if (t.id === "p-newsys") { S.newSys = t.value; return; }
    if (t.getAttribute("data-owner")) { var o = S.systems.filter(function (x) { return x.id === t.getAttribute("data-owner"); })[0]; if (o) o.owner = t.value; return; }
    var k = t.getAttribute("data-w") || t.getAttribute("data-wn"); if (!k) return;
    var v = Math.max(0, Math.min(100, parseInt(t.value, 10) || 0)); S.weights[k] = v;
    var r = $("w-" + k), n = $("wn-" + k); if (r && r !== t) r.value = v; if (n && n !== t) n.value = v;
    var tot = total(), wt = $("w-total"); if (wt) { wt.textContent = totalMsg(tot); wt.style.color = tot === 100 ? "var(--pp-status-ok-ink)" : "var(--pp-status-warn-ink)"; }
    renderStepper();
  });

  document.addEventListener("change", function (e) {
    var t = e.target, id = t.id;
    if (t.getAttribute("data-use")) { var sy = S.systems.filter(function (x) { return x.id === t.getAttribute("data-use"); })[0]; if (sy) { sy.use = t.value; render(); announce(sy.name + ": " + USE_LABEL[sy.use]); } return; }
    if (t.getAttribute("data-pulse")) { S.pulse[t.getAttribute("data-pulse")] = t.value; announce("Answer saved."); return; }
    if (id === "reviewed") { S.reviewed = t.checked; render(); }
    else if (id === "viewer") { S.viewer = t.value; render(); announce("Viewing as " + t.options[t.selectedIndex].text); }
    else if (t.getAttribute("data-w") || t.getAttribute("data-wn")) { render(); }
  });

  $("role-select").addEventListener("change", function (e) { S.role = e.target.value; render(); announce("Acting as " + ROLES[S.role]); });
  $("prev").addEventListener("click", function () { var i = ORDER.indexOf(S.screen); if (i > 0) go(ORDER[i - 1]); });
  $("next").addEventListener("click", function () { var i = ORDER.indexOf(S.screen); if (i < ORDER.length - 1) go(ORDER[i + 1]); });
  $("reset").addEventListener("click", function () { window.clearTimeout(scanTimer); S = initial(); go("a"); announce("Prototype reset."); });

  var dlg = $("baseline-dialog"), lastFocus = null;
  function openBaseline() {
    lastFocus = document.activeElement;
    var srcs = ["Outside-in scan"].concat(Object.keys(S.exports).filter(function (k) { return S.exports[k]; }).map(function (k) { return k.toUpperCase() + " export"; })).concat(CONNECTORS.filter(function (c) { return S.conn[c[0]] === "connected"; }).map(function (c) { return c[1]; }));
    $("bd-desc").innerHTML = "<p style='margin:0 0 8px;'>Locks today's findings and weights as the reference point for future comparison.</p><p style='margin:0 0 6px;'><strong>Sources included:</strong> " + esc(srcs.join(", ")) + "</p><p style='margin:0;'><strong>Weights:</strong> " + AREAS.map(function (a) { return a[1] + " " + S.weights[a[0]] + "%"; }).join(" · ") + "</p>";
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
    $("bd-date").focus();
  }
  function closeBaseline() { if (dlg.close) dlg.close(); else dlg.removeAttribute("open"); if (lastFocus && lastFocus.focus) lastFocus.focus(); }
  $("bd-cancel").addEventListener("click", function () { closeBaseline(); announce("Baseline not recorded."); });
  $("bd-confirm").addEventListener("click", function () {
    var v = $("bd-date").value; if (!v) { $("bd-date").setAttribute("aria-invalid", "true"); return; }
    var p = v.split("-"), months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    S.baseline = (+p[2]) + " " + months[+p[1] - 1] + " " + p[0];
    closeBaseline(); render(); announce("Baseline Date recorded: " + S.baseline);
  });

  render();
})();

</script>
</body>
</html>
