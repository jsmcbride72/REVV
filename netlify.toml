[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback. A real file in the publish directory wins over this rewrite
# (Netlify shadowing). The production build writes dist/index.html,
# dist/about/index.html, dist/blog/index.html, dist/blog/<slug>/index.html,
# and dist/work/<id>/index.html with crawler-readable titles, descriptions,
# canonicals, and social tags, plus dist/robots.txt, dist/sitemap.xml, and dist/llms.txt.
# Do not set force = true, or those shells would never be served.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed Vite bundles. A real file such as /llms.txt is served as itself
# (text/plain) because this rewrite does not set force = true.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
